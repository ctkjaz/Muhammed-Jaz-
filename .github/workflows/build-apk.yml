name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK licenses
        run: |
          if command -v sdkmanager >/dev/null 2>&1; then
            yes | sdkmanager --licenses >/dev/null 2>&1 || true
          elif [ -n "$ANDROID_HOME" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare debug signing keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > debug.keystore
            echo "Using permanent DEBUG_KEYSTORE_BASE64 secret"
          elif [ -s debug.keystore.base64 ]; then
            tr -d '\r\n ' < debug.keystore.base64 | base64 -d > debug.keystore || rm -f debug.keystore
            echo "Using repository debug.keystore.base64"
          fi
          if [ ! -s debug.keystore ]; then
            echo "WARNING: No permanent debug keystore found; generating temporary key"
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          ls -lh debug.keystore

      - name: Prepare Firebase google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s\n' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "Using GOOGLE_SERVICES_JSON secret"
          elif [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | tr -d '\r\n ' | base64 -d > app/google-services.json
            echo "Using GOOGLE_SERVICES_JSON_BASE64 secret"
          elif [ -s app/google-services.json ]; then
            echo "Using repository app/google-services.json"
          else
            echo "::error::Missing app/google-services.json. Add your Firebase config as a repository secret named GOOGLE_SERVICES_JSON in GitHub Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          python3 - <<'PY'
          import json, sys
          try:
              with open("app/google-services.json", "r", encoding="utf-8") as f:
                  data = json.load(f)
          except Exception as exc:
              print(f"::error::app/google-services.json is not valid JSON ({exc}). Check the GOOGLE_SERVICES_JSON secret.")
              sys.exit(1)
          clients = data.get("client", [])
          has_web_client = any(
              oauth.get("client_type") == 3
              for c in clients
              for oauth in (
                  c.get("oauth_client", [])
                  + c.get("services", {}).get("appinvite_service", {}).get("other_platform_oauth_client", [])
              )
          )
          if not has_web_client:
              print("::error::app/google-services.json is missing a Web OAuth client (client_type 3) required for R.string.default_web_client_id.")
              sys.exit(1)
          print("Verified app/google-services.json structure.")
          PY

      - name: Extract app version
        id: app_version
        run: |
          VERSION_NAME=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          VERSION_CODE=$(grep -m1 'versionCode' app/build.gradle.kts | sed -E 's/.*=\s*([0-9]+).*/\1/')
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Detected ClinEdge v$VERSION_NAME (code $VERSION_CODE)"

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Print failed unit test details
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          files = sorted(glob.glob("app/build/test-results/testDebugUnitTest/TEST-*.xml"))
          found = False
          for path in files:
              tree = ET.parse(path)
              root = tree.getroot()
              for tc in root.findall("testcase"):
                  for fail in list(tc.findall("failure")) + list(tc.findall("error")):
                      found = True
                      cls = tc.attrib.get("classname", "")
                      name = tc.attrib.get("name", "")
                      msg = (fail.attrib.get("message") or "").replace("\n", " ")
                      print(f"::error::FAILED {cls} :: {name} -> {msg}")
                      if fail.text:
                          print(fail.text[:2500])
                          print("=" * 72)
          if not found:
              print("No JUnit failure XML entries found.")
          PY

      - name: Upload unit test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 7

      - name: Prepare versioned APK asset
        run: |
          APK_SRC=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          cp "$APK_SRC" "ClinEdge-v${{ steps.app_version.outputs.version_name }}.apk"
          ls -lh "ClinEdge-v${{ steps.app_version.outputs.version_name }}.apk"

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: clinedge-v${{ steps.app_version.outputs.version_name }}-apk
          path: ClinEdge-v${{ steps.app_version.outputs.version_name }}.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release for In-App Updates
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.app_version.outputs.version_name }}
          VERSION_NAME: ${{ steps.app_version.outputs.version_name }}
          VERSION_CODE: ${{ steps.app_version.outputs.version_code }}
          APK_FILE: ClinEdge-v${{ steps.app_version.outputs.version_name }}.apk
        run: |
          NOTES="ClinEdge v${VERSION_NAME} (Build ${VERSION_CODE}) — Tap ${APK_FILE} below or use Settings -> Check for app updates inside the app."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_FILE" --clobber
            gh release edit "$TAG" --title "ClinEdge v${VERSION_NAME}" --notes "$NOTES" --latest
          else
            gh release create "$TAG" "$APK_FILE" \
              --title "ClinEdge v${VERSION_NAME}" \
              --notes "$NOTES" \
              --latest
          fi
